<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | NovaTrade</title>
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="icon" type="image/svg+xml" href="./assets/images/favicon.svg">
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/components.css">
    
    <style>
        .auth-page { min-height: 100vh; }
    </style>
</head>
<body class="auth-page">

    <div class="auth-card">
        <div class="auth-logo">
            <i class="ph-fill ph-chart-line-up" style="color: var(--color-primary)"></i> NovaTrade
        </div>
        
        <div style="text-align: center; margin-bottom: var(--space-4);">
            <h2 style="font-size: var(--text-2xl);">Welcome back</h2>
            <p style="font-size: var(--text-sm); display: flex; align-items: center; justify-content: center; gap: 4px; margin-top: 4px;">
                <i class="ph-fill ph-lock-key" style="color: var(--color-accent);"></i> Secure session active
            </p>
        </div>

        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" required>
                <span class="error-msg"></span>
            </div>
            
            <div class="form-group" style="margin-bottom: var(--space-4);">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-1);">
                    <label for="password" class="form-label" style="margin-bottom: 0;">Password</label>
                    <a href="#" style="font-size: var(--text-xs);">Forgot password?</a>
                </div>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                <span class="error-msg"></span>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
        </form>

        <div class="auth-divider">
            <span>or continue with</span>
        </div>

        <button class="btn btn-outline social-btn">
            <i class="ph-fill ph-google-logo"></i> Google
        </button>
        <button class="btn btn-outline social-btn" style="margin-bottom: var(--space-4);">
            <i class="ph-fill ph-envelope"></i> Email magic link
        </button>
        
        <p style="text-align: center; font-size: var(--text-sm); margin-bottom: 0;">
            Don't have an account? <a href="register.html">Register</a>
        </p>
    </div>

    <!-- Main JS for validation -->
    <script src="./assets/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if(window.validateForm) {
                window.validateForm('loginForm', [
                    { name: 'email', required: true, type: 'email', message: 'Enter a valid email address' },
                    { name: 'password', required: true, minLength: 8, message: 'Password must be at least 8 characters' }
                ]);
            }
        });
    </script>
</body>
</html>
