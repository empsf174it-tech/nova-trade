<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | NovaTrade</title>

    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="icon" type="image/svg+xml" href="./assets/images/favicon.svg">
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/components.css">
</head>
<body class="auth-page">

    <button class="theme-toggle auth-theme-toggle" aria-label="Toggle Dark Mode"><i class="ph ph-sun"></i></button>

    <div class="auth-card">
        <a href="index.html" class="nav-brand auth-logo">
            <i class="ph-fill ph-chart-line-up"></i> NovaTrade
        </a>

        <div class="auth-head">
            <h1>Start trading</h1>
            <p>Create an account to trade markets &amp; build your watchlist</p>
        </div>

        <form id="registerForm" novalidate>
            <div class="form-group">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" id="name" name="name" class="form-control" placeholder="Alex Morgan" required>
                <span class="error-msg"></span>
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="trader@example.com" required>
                <span class="error-msg"></span>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <div class="password-field">
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                    <button type="button" class="password-toggle" aria-label="Show password"><i class="ph ph-eye"></i></button>
                </div>
                <span class="error-msg"></span>
            </div>

            <div class="form-group">
                <label for="confirm_password" class="form-label">Confirm Password</label>
                <div class="password-field">
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="••••••••" required>
                    <button type="button" class="password-toggle" aria-label="Show password"><i class="ph ph-eye"></i></button>
                </div>
                <span class="error-msg"></span>
            </div>

            <div class="form-group" style="margin-bottom: var(--space-4);">
                <label class="auth-check">
                    <input type="checkbox" id="terms" name="terms" required>
                    <span>I agree to the <a href="#" class="auth-link">Terms &amp; Conditions</a> and the <a href="#" class="auth-link">Privacy Policy</a>.</span>
                </label>
                <span class="error-msg"></span>
            </div>

            <button type="submit" class="btn btn-primary auth-submit">Create account</button>
        </form>

        <div class="auth-divider"><span>or</span></div>

        <button class="btn btn-outline social-btn">
            <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
            Continue with Google
        </button>
        <button class="btn btn-outline social-btn">
            <i class="ph-fill ph-apple-logo"></i> Continue with Apple
        </button>

        <p class="auth-foot">Already have an account? <a href="login.html" class="auth-link">Login here</a></p>
    </div>

    <!-- Main JS for theme + validation -->
    <script src="./assets/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if(window.validateForm) {
                window.validateForm('registerForm', [
                    { name: 'name', required: true, message: 'Full name is required' },
                    { name: 'email', required: true, type: 'email', message: 'Enter a valid email address' },
                    { name: 'password', required: true, minLength: 8, message: 'Password must be at least 8 characters' },
                    { name: 'confirm_password', required: true, match: 'password', message: 'Passwords do not match' },
                    { name: 'terms', required: true, message: 'You must accept the terms' }
                ]);
            }
        });
    </script>
</body>
</html>
